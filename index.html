const tabBar=document.getElementById('tabBar');
const mainContent=document.getElementById('mainContent');

days.forEach((day,i)=>{
  const btn=document.createElement('button');
  btn.className='tab-btn'+(i===0?' active':'');
  btn.dataset.key=day.key;
  btn.innerHTML=`${day.label}<span class="count">${day.events.length}</span>`;
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+day.key).classList.add('active');
  });
  tabBar.appendChild(btn);

  const div=document.createElement('div');
  div.className='tab-content'+(i===0?' active':'');
  div.id='tab-'+day.key;
  div.innerHTML=`<div class="day-header"><h2>${day.label}</h2><span class="day-meta">${day.events.length} event order${day.events.length!==1?'s':''}</span></div>`;

  const grid=document.createElement('div');
  grid.className='events-grid';

  day.events.forEach(ev=>{
    const card=document.createElement('div');
    card.className='event-card'+(ev.tentative?' tentative':'');
    const locs=[...new Set(ev.functions.map(f=>f.location))];
    const allTimes=ev.functions.map(f=>f.time).join('<br>');
    card.innerHTML=`
      <div class="card-head">
        <div class="time-block">${allTimes}</div>
        <div>
          <div class="org-name">${ev.org}</div>
          <div class="post-as">${ev.postAs}</div>
        </div>
        <div class="badges">
          ${locs.map(l=>`<span class="badge location">${l}</span>`).join('')}
          ${ev.tentative?'<span class="badge t1">T1 Tentative</span>':''}
          ${ev.manager?`<span class="badge">Mgr: ${ev.manager}</span>`:''}
        </div>
      </div>
      <div class="card-body">
        <div class="info-group"><label>Customer</label><div class="val">${ev.customer}</div></div>
        ${ev.functions.length===1?`<div class="info-group"><label>Function</label><div class="val">${ev.functions[0].fn}</div></div>`:''}
        <div class="info-group"><label>Attendance (EXP/GTD/SET)</label><div class="val">${ev.functions.map(f=>`${f.exp||'—'} / ${f.gtd||'—'} / ${f.set||'—'}`).join('<br>')}</div></div>
      </div>
      ${ev.functions.length>1?`<div class="fn-section"><h4>Functions</h4><table class="fn-table"><thead><tr><th>Time</th><th>Function</th><th>Location</th><th class="fn-att">EXP</th></tr></thead><tbody>${ev.functions.map(f=>`<tr><td class="fn-time">${f.time}</td><td>${f.fn}</td><td class="fn-loc">${f.location}</td><td class="fn-att">${f.exp||''}</td></tr>`).join('')}</tbody></table></div>`:''}
      ${ev.food&&ev.food.length?`<div class="food-section"><h4>F&B Details</h4>${ev.food.map(f=>`<div class="food-item">${f}</div>`).join('')}</div>`:''}
      ${ev.notes&&ev.notes.length?`<div class="notes-section"><h4>Notes</h4>${ev.notes.map(n=>`<div class="note-item ${n.type}">${n.text}</div>`).join('')}</div>`:''}
    `;
    grid.appendChild(card);
  });

  div.appendChild(grid);
  mainContent.appendChild(div);
});
